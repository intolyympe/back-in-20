<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270">
  <!-- shadow on the desk -->
  <ellipse cx="150" cy="262" rx="46" ry="5" fill="#000" opacity="0.25"/>

  <!-- base -->
  <rect x="112" y="244" width="76" height="16" rx="7" fill="#2f3238"/>
  <ellipse cx="150" cy="245" rx="30" ry="8" fill="#41454d"/>

  <!-- arms -->
  <g stroke="#3a3e45" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="240" x2="118" y2="130"/>
    <line x1="118" y1="130" x2="54" y2="88"/>
  </g>
  <g stroke="#6b7079" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="147" y1="236" x2="117" y2="134"/>
    <line x1="116" y1="127" x2="56" y2="88"/>
  </g>
