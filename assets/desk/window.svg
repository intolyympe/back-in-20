<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 330">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8e3"/>
      <stop offset="1" stop-color="#d6ecf7"/>
    </linearGradient>
    <pattern id="slats" width="260" height="12" patternUnits="userSpaceOnUse">
      <rect width="260" height="9" fill="#f3eee5"/>
      <rect y="9" width="260" height="3" fill="#cdc4b4"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect x="6" y="0" width="248" height="306" rx="4" fill="#f6f2ea"/>
  <rect x="20" y="14" width="220" height="278" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="70" cy="160" rx="30" ry="9"/>
    <ellipse cx="88" cy="153" rx="18" ry="9"/>
    <ellipse cx="190" cy="140" rx="24" ry="7"/>
  </g>

  <!-- city -->
  <g fill="#9fb3c4">
    <rect x="20" y="200" width="38" height="92"/>
    <rect x="62" y="172" width="32" height="120"/>
    <rect x="98" y="214" width="48" height="78"/>
    <rect x="150" y="186" width="30" height="106"/>
    <rect x="184" y="222" width="56" height="70"/>
  </g>
  <g fill="#d3e0ea">
    <rect x="27" y="210" width="8" height="10"/><rect x="42" y="210" width="8" height="10"/>
    <rect x="27" y="230" width="8" height="10"/><rect x="42" y="250" width="8" height="10"/>
    <rect x="69" y="182" width="7" height="10"/><rect x="81" y="182" width="7" height="10"/>
    <rect x="69" y="202" width="7" height="10"/><rect x="81" y="222" width="7" height="10"/>
    <rect x="69" y="242" width="7" height="10"/><rect x="157" y="196" width="7" height="9"/>
    <rect x="168" y="214" width="7" height="9"/><rect x="157" y="232" width="7" height="9"/>
    <rect x="106" y="224" width="9" height="9"/><rect x="124" y="224" width="9" height="9"/>
    <rect x="106" y="244" width="9" height="9"/>
  </g>

  <!-- tree in front -->
  <rect x="206" y="262" width="6" height="30" fill="#6b5340"/>
  <circle cx="209" cy="250" r="22" fill="#79a463"/>
  <circle cx="196" cy="262" r="14" fill="#6c9757"/>
  <circle cx="224" cy="262" r="13" fill="#86b06f"/>

  <!-- mullion -->
  <rect x="127" y="14" width="6" height="278" fill="#f6f2ea"/>

  <!-- blinds, half down -->
  <rect x="16" y="8" width="228" height="124" fill="url(#slats)"/>
  <rect x="13" y="130" width="234" height="8" rx="2" fill="#b9af9e"/>
  <line x1="226" y1="138" x2="226" y2="196" stroke="#9a907e" stroke-width="2"/>
  <circle cx="226" cy="199" r="4" fill="#9a907e"/>

  <!-- sill -->
  <rect x="0" y="300" width="260" height="16" rx="3" fill="#ebe3d5"/>
  <rect x="4" y="316" width="252" height="6" fill="#d2c8b7"/>
</svg>
