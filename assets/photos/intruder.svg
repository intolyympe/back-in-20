<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <!-- The front camera catching the player: dark office, a hooded silhouette
       lit from below by the phone screen. Anonymous on purpose. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3342"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <radialGradient id="ceiling" cx="0.66" cy="0.06" r="0.3">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <!-- Light from the phone screen, from below. -->
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#8fbaff" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#8fbaff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8fbaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#55637d"/>
      <stop offset="0.35" stop-color="#2e3647"/>
      <stop offset="0.7" stop-color="#171b24"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.3 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="600" height="800" fill="url(#room)"/>
  <rect width="600" height="800" fill="url(#ceiling)"/>
  <ellipse cx="396" cy="50" rx="66" ry="9" fill="#fff8e6" opacity="0.8" filter="url(#soft)"/>
  <!-- shelf in the background -->
  <rect x="34" y="262" width="150" height="9" fill="#394150"/>
  <rect x="46" y="214" width="20" height="48" fill="#4a3f3a"/>
  <rect x="70" y="226" width="15" height="36" fill="#3f4a5a"/>

  <g filter="url(#soft)">
    <!-- shoulders and body, too close to the lens -->
    <path d="M30 800 C40 650 150 585 300 580 C450 585 560 650 570 800 Z" fill="#12151c"/>
    <!-- hood -->
    <path d="M168 520 C150 330 215 190 300 188 C385 190 450 330 432 520 C420 590 380 610 300 612 C220 610 180 590 168 520 Z" fill="#191d26"/>
    <!-- face inside the hood, lit from the chin up -->
    <path d="M222 430 C222 330 258 285 300 285 C342 285 378 330 378 430 C378 510 345 562 300 566 C255 562 222 510 222 430 Z" fill="url(#face)"/>
    <!-- the hood's rim shades the forehead -->
    <path d="M206 360 C220 270 262 250 300 250 C338 250 380 270 394 360 C370 315 338 300 300 300 C262 300 230 315 206 360 Z" fill="#191d26"/>
    <!-- eyes and nose only as shadows -->
    <ellipse cx="270" cy="408" rx="20" ry="8" fill="#141821" opacity="0.8"/>
    <ellipse cx="330" cy="408" rx="20" ry="8" fill="#141821" opacity="0.8"/>
    <path d="M300 420 L292 470 L308 470 Z" fill="#202634" opacity="0.6"/>
    <!-- neck -->
    <path d="M262 560 L262 600 C280 610 320 610 338 600 L338 560 Z" fill="#20252f"/>
  </g>
  <rect width="600" height="800" fill="url(#glow)"/>
  <rect width="600" height="800" filter="url(#grain)"/>
</svg>
