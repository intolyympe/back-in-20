<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back in 20 — De retour dans 20 minutes</title>
  <meta name="description" content="Assieds-toi au bureau de Camille et devine ses mots de passe, indice après indice, avant son retour.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desk.css">
  <link rel="stylesheet" href="css/notebook.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/phone.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="stage" id="stage">
    <section class="desk" aria-label="Le bureau de Camille">
      <div class="wall"></div>
      <div class="desk-top"></div>

      <button class="hotspot calendar" data-hotspot="calendar" aria-label="Calendrier">
        <span class="calendar-month">Novembre</span>
        <span class="calendar-grid"></span>
      </button>

      <div class="monitor">
        <button class="hotspot monitor-screen" data-hotspot="monitor" aria-label="Écran de l'ordinateur"></button>
        <div class="monitor-neck"></div>
        <div class="monitor-base"></div>
      </div>

      <button class="hotspot postit" data-hotspot="postit" aria-label="Post-it sur l'écran">
        De retour<br>dans 20 min !<br><span class="postit-sign">— C.</span>
      </button>

      <div class="keyboard"></div>
      <button class="hotspot mug" data-hotspot="mug" aria-label="Tasse de café"></button>
      <button class="hotspot phone" data-hotspot="phone" aria-label="Téléphone de Camille"></button>

      <div class="clock" id="clock" role="timer" aria-label="Temps avant le retour de Camille">20:00</div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>

      <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Vue rapprochée" tabindex="-1" hidden>
        <div class="overlay-content" id="overlay-content"></div>
        <p class="overlay-hint"><kbd>Échap</kbd> pour reposer</p>
      </div>
    </section>

    <aside class="notebook" aria-labelledby="notebook-title">
      <h2 class="notebook-title" id="notebook-title">Carnet</h2>
      <p class="notebook-empty" id="notebook-empty">Rien pour l’instant. Fouille le bureau.</p>
      <ol class="notebook-list" id="notebook-list"></ol>
    </aside>

    <section class="screen" id="start-screen" aria-labelledby="game-title">
      <h1 class="screen-title" id="game-title">Back in 20</h1>
      <p class="screen-subtitle">De retour dans 20 minutes</p>
      <p class="screen-text">Camille vient de quitter son bureau. Tu as 20 minutes pour prendre le contrôle de sa vie numérique.</p>
      <button class="screen-button" id="start-button">Commencer</button>
    </section>

    <section class="screen" id="end-screen" aria-labelledby="end-title" hidden>
      <h2 class="screen-title" id="end-title">Camille est de retour.</h2>
      <p class="screen-text">Le temps est écoulé.</p>
      <button class="screen-button" id="restart-button">Rejouer</button>
    </section>
  </main>
</body>
</html>
